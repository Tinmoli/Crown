# 多个 Loom 版本在同一工程配置时会进行大量 JAR 转换。默认采用低并发，
# 避免在开发机或 CI 上耗尽系统提交内存；构建结果不受影响。
org.gradle.jvmargs=-Xmx1024m -Xss512k -XX:ActiveProcessorCount=4 -XX:CICompilerCount=2 -XX:ReservedCodeCacheSize=128m -XX:CompressedClassSpaceSize=256m -XX:MaxMetaspaceSize=384m -Dfile.encoding=UTF-8
org.gradle.parallel=false
org.gradle.workers.max=2
org.gradle.vfs.watch=false
org.gradle.configuration-cache=false

mod_version=0.1.0-SNAPSHOT
maven_group=dev.xiaomu.crown
loader_version=0.19.3
mint_api_version=0.1.0-SNAPSHOT
permissions_api_version=0.4.1

junit_version=5.13.4
gson_version=2.13.1
snakeyaml_engine_version=2.9
hikari_version=6.3.1
sqlite_jdbc_version=3.50.3.0
mysql_connector_version=9.4.0