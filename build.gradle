plugins {
    id "net.fabricmc.fabric-loom" version "1.17.21"
}

group = maven_group
version = mod_version
base { archivesName = "crown-fabric-${minecraft_version}" }

repositories {
    mavenCentral()
    maven { url = "https://maven.fabricmc.net/" }
    maven { url = "https://maven.nucleoid.xyz/" }
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${fabric_api_version}"
    compileOnly "eu.pb4:placeholder-api:${placeholder_api_version}"

    // Bundle the libraries required by this standalone server mod.
    [
        "eu.pb4:sgui:${sgui_version}",
        "net.kyori:adventure-text-minimessage:${adventure_version}",
        "net.kyori:adventure-api:${adventure_version}",
        "net.kyori:adventure-key:${adventure_version}",
        "net.kyori:examination-api:1.3.0",
        "net.kyori:examination-string:1.3.0",
        "org.snakeyaml:snakeyaml-engine:${snakeyaml_engine_version}",
        "com.google.code.gson:gson:${gson_version}",
        "com.zaxxer:HikariCP:${hikari_version}",
        "org.xerial:sqlite-jdbc:${sqlite_jdbc_version}",
        "com.mysql:mysql-connector-j:${mysql_connector_version}"
    ].each { library ->
        implementation library
        include library
    }
}

java { toolchain.languageVersion = JavaLanguageVersion.of(25) }

tasks.withType(JavaCompile).configureEach {
    options.release = 25
    options.encoding = "UTF-8"
    options.compilerArgs.addAll(["-Xlint:all", "-Werror"])
}

tasks.withType(Jar).configureEach {
    reproducibleFileOrder = true
    preserveFileTimestamps = false
}

processResources {
    inputs.property "version", project.version
    filesMatching("fabric.mod.json") { expand "version": project.version }
}
