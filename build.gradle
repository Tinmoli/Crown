plugins {
    id "base"
}

def crownVersionProjects = [
        "26.1", "26.1.1", "26.1.2", "26.2", "26.3"
].collect { ":versions:${it}" }.findAll { findProject(it) != null }

allprojects {
    group = providers.gradleProperty("maven_group").getOrElse("dev.xiaomu.crown")
    version = providers.gradleProperty("mod_version").getOrElse("0.1.0-SNAPSHOT")

    repositories {
        mavenLocal()
        mavenCentral()
        maven {
            name = "Fabric"
            url = "https://maven.fabricmc.net/"
        }
        maven {
            name = "Nucleoid"
            url = "https://maven.nucleoid.xyz/"
        }
    }
}

subprojects {
    plugins.withType(JavaPlugin).configureEach {
        java {
            toolchain.languageVersion = JavaLanguageVersion.of(25)
            sourceCompatibility = JavaVersion.VERSION_21
            targetCompatibility = JavaVersion.VERSION_21
        }

        tasks.withType(JavaCompile).configureEach {
            options.release = 21
            options.encoding = "UTF-8"
            options.compilerArgs.addAll(["-Xlint:all", "-Werror"])
        }

        tasks.withType(Test).configureEach {
            useJUnitPlatform()
            testLogging {
                events "failed", "skipped"
                exceptionFormat "full"
            }
        }

        tasks.withType(Jar).configureEach {
            reproducibleFileOrder = true
            preserveFileTimestamps = false
        }
    }
}

tasks.register("buildAllVersions") {
    group = "build"
    description = "构建所有支持的 26.x 版本，并把发布 JAR 收集到 dist。"
    if (crownVersionProjects.size() != 5) {
        throw new GradleException("buildAllVersions requires all five version "
                + "projects; omit -PcrownVersions or list all supported versions")
    }
    dependsOn crownVersionProjects.collect { "${it}:jar" }

    doLast {
        delete layout.projectDirectory.dir("dist")
        copy {
            crownVersionProjects.each { projectPath ->
                from project(projectPath).tasks.named("jar")
                        .flatMap { it.archiveFile }
            }
            into layout.projectDirectory.dir("dist")
        }
    }
}
