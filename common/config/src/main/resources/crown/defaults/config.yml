# Crown 核心配置
# 修改后可执行 /crown reload 热重载；数据库连接类设置除外。
config-version: 3

# 界面与消息语言。默认支持 zh_cn 和 en_us。
language: "zh_cn"

# 服务器默认称号。默认称号不写入玩家仓库，也不会过期。
default-title:
  # 是否启用默认称号。
  enabled: true
  # 新玩家首次创建数据时是否选择默认称号。
  equip-for-new-player: true
  # 默认称号正文。
  text: "萌新"
  # 默认称号前缀。
  prefix: "&7["
  # 默认称号后缀。
  suffix: "&7]"
  # 仓库界面中使用的物品 ID。
  icon: "minecraft:name_tag"

# Crown 内置称号币。称号币只能由管理员管理，玩家不能互转。
title-coin:
  # 称号币名称。
  name: "称号币"
  # 称号币符号。
  symbol: "✦"
  # 可用变量：{amount}、{name}、{symbol}。
  format: "{amount} {name}"
  # 单个玩家允许持有的最大余额。
  maximum-balance: 9223372036854775807

# 玩家聊天输入式自定义称号商品。
custom-title:
  # 是否允许购买自定义称号。
  enabled: true
  duration:
    # PERMANENT 表示永久；LIMITED 表示限时。
    type: "PERMANENT"
    # LIMITED 时必须为正数；PERMANENT 时必须为 0。
    days: 0
  # 称号币价格，必须是非负整数；0 表示免费领取。
  price: 50
  # 玩家只输入正文，前后缀由服务器统一控制。
  prefix: "&7["
  suffix: "&7]"
  # 正文最少和最多可见 Unicode 字符数。
  minimum-length: 1
  maximum-length: 16
  # 是否允许十六进制 RGB（&#RRGGBB、§x、&x、MiniMessage 十六进制颜色等）。
  allow-rgb: true
  # 是否允许 MiniMessage 渐变、彩虹和颜色过渡；同时需要 allow-rgb。
  allow-gradient: true
  # 是否允许 &/§ 传统颜色、修饰码及 MiniMessage 命名颜色、粗体等修饰。
  allow-formatting: true
  # 聊天输入会话超时时间。
  input-timeout-seconds: 60
  # 输入以下完整文本时取消会话。
  cancel-keywords:
    - "取消"
    - "cancel"
  # 按实际显示文字匹配违禁词，忽略颜色、英文大小写、全角及零宽格式字符。
  # 命中后禁止设置和购买，并在聊天栏及屏幕下方显示警告。
  # OP 豁免违禁词检查。空列表 [] 表示不拦截；修改后 /crown reload 生效。
  forbidden-words: ["服主", "管理员", "服务器管理员", "管理组", "腐竹", "admin", "administrator", "owner", "server owner"]

# 称号展示设置。每个渠道可独立选择 placeholder、vanilla 或 disabled。
# placeholder（默认）：Crown 只提供变量，由聊天/TAB/计分板模组显示。
# vanilla：Crown 使用原版服务端机制直接显示。
# disabled：Crown 不在该渠道主动显示，但变量仍然可以读取。
display:
  channels:
    chat: "placeholder"
    tab: "placeholder"
    nametag: "placeholder"
  # vanilla 模式使用的原版显示模板。
  direct:
    chat:
      template: "{title} {player}: {message}"
    tab:
      template: "{title} {player}"
    nametag:
      template: "{title} {player}"

# 购买与异步操作限制。
purchase:
  # 每名玩家允许存在的未完成订单数。
  maximum-pending-orders-per-player: 1
  # 每人最多持有的仓库条目数，普通和自定义共同计算；-1 不限制，0 禁止新增。
  # 已过期但未删除的条目仍占名额；默认称号不占名额。
  maximum-owned-titles-per-player: -1

# 从仓库删除称号时按该条目实际支付金额退款，不受商品当前价格影响。
deletion:
  refund-enabled: true
  # 0～100，结果向下取整；免费、默认及无购买记录的称号不退款。
  refund-percent: 100
  # 过期称号是否仍可退款；默认不退。
  refund-expired: false

# 防止恶意配置或玩家输入耗尽服务端资源。
safety:
  maximum-title-source-length: 512
  maximum-visible-title-length: 64
  maximum-gui-open-count-per-player: 1
