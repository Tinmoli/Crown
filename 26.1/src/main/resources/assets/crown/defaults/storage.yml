# Crown 数据库存储配置
# 首次安装建议保持 sqlite。修改数据库连接后需要重启；不会自动搬移数据。
config-version: 1

# 存储类型：sqlite 或 mysql。
type: "sqlite"

sqlite:
  # 相对于游戏目录的 SQLite 数据库文件。
  path: "config/crown/data/crown.db"
  # SQLite 忙等待超时。
  busy-timeout-millis: 5000
  # 是否启用 WAL。
  wal: true
  # OFF、NORMAL、FULL 或 EXTRA。
  synchronous: "NORMAL"

mysql:
  host: "127.0.0.1"
  port: 3306
  database: "crown"
  username: "crown"
  # 请务必修改默认密码。Crown 不会把密码写入日志。
  password: "change-me"
  # 只允许 1～24 个字母、数字或下划线。
  table-prefix: "crown_"
  # 自定义 JDBC 参数。此映射由用户管理，升级时不会删除额外参数。
  parameters:
    useSSL: false
    allowPublicKeyRetrieval: false
    serverTimezone: "UTC"
    characterEncoding: "utf8"
  pool:
    minimum-idle: 1
    maximum-size: 10
    connection-timeout-millis: 5000
    validation-timeout-millis: 3000
    idle-timeout-millis: 600000
    maximum-lifetime-millis: 1800000
